services:
  # Infrastructure Services
  redis:
    image: redis:7-alpine
    container_name: microservices_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: ["sh", "-c", "redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$${REDIS_PASSWORD}\""]
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PostgreSQL for User Service
  postgres_user:
    image: postgres:15-alpine
    container_name: microservices_postgres_user
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD:?POSTGRES_USER_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    expose:
      - "5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
      - ./scripts/postgres-init-user.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userdb"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PostgreSQL for Post Service
  postgres_post:
    image: postgres:15-alpine
    container_name: microservices_postgres_post
    environment:
      POSTGRES_DB: postdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_POST_PASSWORD:?POSTGRES_POST_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    expose:
      - "5432"
    volumes:
      - postgres_post_data:/var/lib/postgresql/data
      - ./scripts/postgres-init-post.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postdb"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PostgreSQL for Notification Service
  postgres_notification:
    image: postgres:15-alpine
    container_name: microservices_postgres_notification
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD:?POSTGRES_NOTIFICATION_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    expose:
      - "5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
      - ./scripts/postgres-init-notification.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notificationdb"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # OpenSearch for search-service. The security plugin stays on and HTTP basic
  # auth is required. TLS on the REST port stays off inside the private network;
  # the password is what stops an unauthenticated client.
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: microservices_opensearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?OPENSEARCH_PASSWORD is required}
      SEARCH_USERNAME: ${OPENSEARCH_SEARCH_USERNAME:-search}
      SEARCH_PASSWORD: ${OPENSEARCH_SEARCH_PASSWORD:?OPENSEARCH_SEARCH_PASSWORD is required}
      plugins.security.ssl.http.enabled: "false"
    # search-service does not log in as admin. Once the node answers, this
    # creates (or updates) its user and a role limited to the two indices it
    # owns, and removes the image's demo users. Every step is idempotent, so it
    # runs on every start. "users" and "posts" are OPENSEARCH_USERS_INDEX and
    # OPENSEARCH_POSTS_INDEX of search-service.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Passwords go into mode-600 files, never into curl's arguments: those are
        # visible to every process on the host.
        umask 077
        esc() { local v=$${1//\\/\\\\}; printf '%s' "$${v//\"/\\\"}"; }
        printf 'user = "admin:%s"\n' "$$(esc "$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}")" > /tmp/admin.curl
        printf '{"password":"%s"}' "$$(esc "$${SEARCH_PASSWORD}")" > /tmp/search-user.json
        # The image ships demo users whose password is their name (readall can read
        # every index). On a new data volume they are dropped before the security
        # index is built from this file; on an existing one the loop below deletes
        # them, except kibanaserver, which is reserved and survives until the volume
        # is recreated.
        demo='anomalyadmin|kibanaserver|kibanaro|logstash|readall|snapshotrestore'
        users=config/opensearch-security/internal_users.yml
        awk -v demo="^\"?($$demo)\"?:" '/^[^[:space:]#]/ { skip = ($$0 ~ demo) } !skip' "$$users" > /tmp/internal_users.yml && cat /tmp/internal_users.yml > "$$users"
        (
          api=http://localhost:9200/_plugins/_security/api
          n=0
          until curl -sf -o /dev/null -K /tmp/admin.curl http://localhost:9200/_cluster/health; do
            n=$$((n + 1))
            [ $$((n % 20)) -eq 0 ] && echo "opensearch security bootstrap: the node is not up yet or does not accept the admin password"
            sleep 3
          done
          # A refusal is printed with OpenSearch's reason (a weak password, for one):
          # until this succeeds search-service cannot log in.
          admin() {
            out=$$(curl -s -w ' HTTP %{http_code}' -K /tmp/admin.curl -H 'Content-Type: application/json' -X "$$1" "$$api/$$2" $${3:+-d "$$3"})
            case "$$out" in *' HTTP 200' | *' HTTP 201') return 0 ;; *' HTTP 404') [ "$$1" = DELETE ] && return 0 ;; esac
            echo "opensearch security bootstrap: $$1 $$2 refused: $$out"
            return 1
          }
          until admin PUT roles/blog_search '{"index_permissions":[{"index_patterns":["users","posts"],"allowed_actions":["crud","create_index","indices:admin/get"]}]}' \
            && admin PUT "internalusers/$${SEARCH_USERNAME}" @/tmp/search-user.json \
            && admin PUT rolesmapping/blog_search '{"users":["'"$${SEARCH_USERNAME}"'"]}' \
            && admin DELETE internalusers/anomalyadmin && admin DELETE internalusers/kibanaro && admin DELETE internalusers/logstash \
            && admin DELETE internalusers/readall && admin DELETE internalusers/snapshotrestore; do sleep 15; done
          if curl -sf -o /dev/null -K /tmp/admin.curl "$$api/internalusers/kibanaserver"; then
            echo "opensearch security bootstrap: the reserved demo user kibanaserver is still present; recreate the data volume to drop it (if it is back on a new volume, the image has put it back and the removal above no longer works)"
          fi
          echo "opensearch security ready: user $${SEARCH_USERNAME} is limited to the indices users and posts"
        ) &
        exec ./opensearch-docker-entrypoint.sh opensearch
    expose:
      - "9200"
      - "9600"
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -K /tmp/admin.curl http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Kafka for search indexing (separate from RabbitMQ). Client listener is
  # SASL/PLAIN. The KRaft controller listener has no authentication, so it is
  # bound to loopback and not exposed to the other containers.
  kafka:
    image: apache/kafka:3.7.0
    container_name: microservices_kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        umask 077
        cat > /tmp/kafka_server_jaas.conf <<EOF
        KafkaServer {
          org.apache.kafka.common.security.plain.PlainLoginModule required
          username="admin"
          password="$${KAFKA_ADMIN_PASSWORD}"
          user_admin="$${KAFKA_ADMIN_PASSWORD}"
          user_app="$${KAFKA_SASL_PASSWORD}";
        };
        EOF
        export KAFKA_OPTS="-Djava.security.auth.login.config=/tmp/kafka_server_jaas.conf"
        # ACLs live in the cluster metadata, not in a file, so they are written
        # once the broker answers. Adding an ACL that exists changes nothing, so
        # this runs on every start. Until it is done the broker refuses the
        # services' requests.
        (
          printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="%s";\n' "$${KAFKA_ADMIN_PASSWORD}" > /tmp/admin.properties
          acl() { KAFKA_OPTS= KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-acls.sh --bootstrap-server localhost:9092 --command-config /tmp/admin.properties "$$@" >/dev/null 2>&1; }
          until acl --list; do sleep 3; done
          until acl --add --allow-principal User:app --operation Read --operation Write --operation Describe --operation Create --topic search. --resource-pattern-type prefixed \
            && acl --add --allow-principal User:app --operation Read --operation Describe --group search- --resource-pattern-type prefixed; do sleep 3; done
          echo "kafka acls ready: User:app may use topics search.* and consumer groups search-*"
        ) &
        exec /etc/kafka/docker/run
    expose:
      - "9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_SASL_PLAINTEXT_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-app}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD is required}
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?KAFKA_ADMIN_PASSWORD is required}
      # The services share the "app" user, which may only use search.* topics
      # and search-* consumer groups (ACLs above). "admin" is the broker's own
      # identity. ANONYMOUS is what this node is on its controller listener,
      # which is plaintext and bound to loopback; nothing can be ANONYMOUS on
      # the SASL listener.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: "User:admin;User:ANONYMOUS"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "printf 'security.protocol=SASL_PLAINTEXT\\nsasl.mechanism=PLAIN\\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=\"%s\" password=\"%s\";\\n' \"$$KAFKA_SASL_USERNAME\" \"$$KAFKA_SASL_PASSWORD\" > /tmp/client.properties && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --command-config /tmp/client.properties --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: microservices_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:?RABBITMQ_VHOST is required}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit log_levels [{connection,error}]"
    expose:
      - "5672"         # AMQP port
      - "15672"        # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      # A TCP check of the AMQP port, not the RabbitMQ CLI. Docker runs the check
      # as root from the first seconds of the start period; when the CLI runs
      # before the server has written its Erlang cookie it creates the cookie
      # itself, owned by root, and the server dies with "eacces". It restarts,
      # but `compose up` has by then given up on everything that depends on it.
      # `ping` had the same problem and also answered before the port was open.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Core Services
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      args:
        - BUILD_ENV=production
    container_name: microservices_auth_service
    expose:
      - "${AUTH_SERVICE_PORT:-8081}"
      - "50051"
    env_file:
      - path: ./services/auth-service/.env
        required: false
    environment:
      PORT: ${AUTH_SERVICE_PORT:-8081}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_TRANSPORT_SECURITY: ${SERVICE_TRANSPORT_SECURITY:?SERVICE_TRANSPORT_SECURITY must be mesh or app_mtls}
      INTERNAL_HTTP_TRUST_MODE: ${INTERNAL_HTTP_TRUST_MODE:?INTERNAL_HTTP_TRUST_MODE is required}
      GRPC_TLS_ENABLED: ${GRPC_TLS_ENABLED:-false}
      GRPC_TLS_CA_FILE: ${GRPC_TLS_CA_FILE:-}
      GRPC_TLS_CERT_FILE: ${GRPC_TLS_CERT_FILE:-}
      GRPC_TLS_KEY_FILE: ${GRPC_TLS_KEY_FILE:-}
      GRPC_TLS_REQUIRE_CLIENT_CERT: ${GRPC_TLS_REQUIRE_CLIENT_CERT:-false}
      GRPC_REFLECTION_ENABLED: ${GRPC_REFLECTION_ENABLED:-false}
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      USER_SERVICE_GRPC_ADDR: user-service:50052
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/v1/auth/google/callback}
      GOOGLE_DEFAULT_WEB_REDIRECT_URI: ${GOOGLE_DEFAULT_WEB_REDIRECT_URI:-http://localhost:3000/auth/callback}
      GOOGLE_ALLOWED_WEB_REDIRECT_URIS: ${GOOGLE_ALLOWED_WEB_REDIRECT_URIS:-http://localhost:3000/auth/callback}
      GOOGLE_ALLOWED_MOBILE_REDIRECT_URIS: ${GOOGLE_ALLOWED_MOBILE_REDIRECT_URIS:-myapp://auth/callback}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${AUTH_SERVICE_PORT:-8081}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
      args:
        - BUILD_ENV=production
    container_name: microservices_user_service
    expose:
      - "${USER_SERVICE_PORT:-8082}"
      - "50052"
    env_file:
      - path: ./services/user-service/.env
        required: false
    environment:
      PORT: ${USER_SERVICE_PORT:-8082}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_TRANSPORT_SECURITY: ${SERVICE_TRANSPORT_SECURITY:?SERVICE_TRANSPORT_SECURITY must be mesh or app_mtls}
      INTERNAL_HTTP_TRUST_MODE: ${INTERNAL_HTTP_TRUST_MODE:?INTERNAL_HTTP_TRUST_MODE is required}
      GRPC_TLS_ENABLED: ${GRPC_TLS_ENABLED:-false}
      GRPC_TLS_CA_FILE: ${GRPC_TLS_CA_FILE:-}
      GRPC_TLS_CERT_FILE: ${GRPC_TLS_CERT_FILE:-}
      GRPC_TLS_KEY_FILE: ${GRPC_TLS_KEY_FILE:-}
      GRPC_TLS_REQUIRE_CLIENT_CERT: ${GRPC_TLS_REQUIRE_CLIENT_CERT:-false}
      GRPC_REFLECTION_ENABLED: ${GRPC_REFLECTION_ENABLED:-false}
      DATABASE_URL: postgres://postgres:${POSTGRES_USER_PASSWORD:?POSTGRES_USER_PASSWORD is required}@postgres_user:5432/userdb?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC_USERS: ${KAFKA_TOPIC_USERS:-search.users}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?KAFKA_SASL_USERNAME is required}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD is required}
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-60}
      DB_MIGRATION_PATH: ${DB_MIGRATION_PATH:-./migrations}
    depends_on:
      postgres_user:
        condition: service_healthy
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${USER_SERVICE_PORT:-8082}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  post-service:
    build:
      context: .
      dockerfile: services/post-service/Dockerfile
      args:
        - BUILD_ENV=production
    container_name: microservices_post_service
    expose:
      - "${POST_SERVICE_PORT:-8083}"
      - "50053"
    env_file:
      - path: ./services/post-service/.env
        required: false
    environment:
      PORT: ${POST_SERVICE_PORT:-8083}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_TRANSPORT_SECURITY: ${SERVICE_TRANSPORT_SECURITY:?SERVICE_TRANSPORT_SECURITY must be mesh or app_mtls}
      INTERNAL_HTTP_TRUST_MODE: ${INTERNAL_HTTP_TRUST_MODE:?INTERNAL_HTTP_TRUST_MODE is required}
      GRPC_TLS_ENABLED: ${GRPC_TLS_ENABLED:-false}
      GRPC_TLS_CA_FILE: ${GRPC_TLS_CA_FILE:-}
      GRPC_TLS_CERT_FILE: ${GRPC_TLS_CERT_FILE:-}
      GRPC_TLS_KEY_FILE: ${GRPC_TLS_KEY_FILE:-}
      GRPC_TLS_REQUIRE_CLIENT_CERT: ${GRPC_TLS_REQUIRE_CLIENT_CERT:-false}
      GRPC_REFLECTION_ENABLED: ${GRPC_REFLECTION_ENABLED:-false}
      DATABASE_URL: postgres://postgres:${POSTGRES_POST_PASSWORD:?POSTGRES_POST_PASSWORD is required}@postgres_post:5432/postdb?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-60}
      DB_MIGRATION_PATH: ${DB_MIGRATION_PATH:-./migrations}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/${RABBITMQ_VHOST:?RABBITMQ_VHOST is required}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-microservices_events}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC_POSTS: ${KAFKA_TOPIC_POSTS:-search.posts}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?KAFKA_SASL_USERNAME is required}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD is required}
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
    depends_on:
      postgres_post:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${POST_SERVICE_PORT:-8083}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
      args:
        - BUILD_ENV=production
    container_name: microservices_notification_service
    expose:
      - "${NOTIFICATION_SERVICE_PORT:-8084}"
    env_file:
      - path: ./services/notification-service/.env
        required: false
    environment:
      PORT: ${NOTIFICATION_SERVICE_PORT:-8084}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      INTERNAL_HTTP_TRUST_MODE: ${INTERNAL_HTTP_TRUST_MODE:?INTERNAL_HTTP_TRUST_MODE is required}
      DATABASE_URL: postgres://postgres:${POSTGRES_NOTIFICATION_PASSWORD:?POSTGRES_NOTIFICATION_PASSWORD is required}@postgres_notification:5432/notificationdb?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-60}
      DB_MIGRATION_PATH: ${DB_MIGRATION_PATH:-./migrations}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/${RABBITMQ_VHOST:?RABBITMQ_VHOST is required}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-microservices_events}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE_NOTIFICATIONS:-post_notifications}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-post.*}
      RABBITMQ_DLX: ${RABBITMQ_DLX:-blog_events.dlx}
      RABBITMQ_DLQ: ${RABBITMQ_DLQ:-post_notifications_dlq}
      RABBITMQ_DLQ_ROUTING_KEY: ${RABBITMQ_DLQ_ROUTING_KEY:-post.failed}
      RABBITMQ_PREFETCH_COUNT: ${RABBITMQ_PREFETCH_COUNT:-10}
      RABBITMQ_RECONNECT_DELAY: ${RABBITMQ_RECONNECT_DELAY:-5}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      NOTIFICATION_CLEANUP_DAYS: ${NOTIFICATION_CLEANUP_DAYS:-30}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-100}
    depends_on:
      postgres_notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${NOTIFICATION_SERVICE_PORT:-8084}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
      args:
        - BUILD_ENV=production
    container_name: microservices_search_service
    expose:
      - "50054"
      - "${SEARCH_SERVICE_METRICS_HTTP_PORT:-9095}"
    env_file:
      - path: ./services/search-service/.env
        required: false
    environment:
      GRPC_PORT: 50054
      METRICS_HTTP_PORT: ${SEARCH_SERVICE_METRICS_HTTP_PORT:-9095}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_TRANSPORT_SECURITY: ${SERVICE_TRANSPORT_SECURITY:?SERVICE_TRANSPORT_SECURITY must be mesh or app_mtls}
      GRPC_TLS_ENABLED: ${GRPC_TLS_ENABLED:-false}
      GRPC_TLS_CA_FILE: ${GRPC_TLS_CA_FILE:-}
      GRPC_TLS_CERT_FILE: ${GRPC_TLS_CERT_FILE:-}
      GRPC_TLS_KEY_FILE: ${GRPC_TLS_KEY_FILE:-}
      GRPC_TLS_REQUIRE_CLIENT_CERT: ${GRPC_TLS_REQUIRE_CLIENT_CERT:-false}
      GRPC_REFLECTION_ENABLED: ${GRPC_REFLECTION_ENABLED:-false}
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USERNAME: ${OPENSEARCH_SEARCH_USERNAME:-search}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_SEARCH_PASSWORD:?OPENSEARCH_SEARCH_PASSWORD is required}
      OPENSEARCH_USERS_INDEX: users
      OPENSEARCH_POSTS_INDEX: posts
      KAFKA_BROKERS: kafka:9092
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?KAFKA_SASL_USERNAME is required}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?KAFKA_SASL_PASSWORD is required}
      KAFKA_TOPIC_USERS: search.users
      KAFKA_TOPIC_POSTS: search.posts
      KAFKA_DLQ_TOPIC: search.dlq
      KAFKA_CONSUMER_GROUP: search-indexer
      KAFKA_RETRY_BACKOFF_MS: ${KAFKA_RETRY_BACKOFF_MS:-500}
      USER_SERVICE_GRPC_ADDR: user-service:50052
    depends_on:
      opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - internal_net
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
      args:
        - BUILD_ENV=production
    container_name: microservices_api_gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:${API_GATEWAY_PORT:-8080}"
    # Metrics stay on the internal network for Prometheus; never published.
    expose:
      - "${API_GATEWAY_METRICS_HTTP_PORT:-9095}"
    env_file:
      - path: ./services/api-gateway/.env
        required: false
    environment:
      PORT: ${API_GATEWAY_PORT:-8080}
      METRICS_HTTP_PORT: ${API_GATEWAY_METRICS_HTTP_PORT:-9095}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_TRANSPORT_SECURITY: ${SERVICE_TRANSPORT_SECURITY:?SERVICE_TRANSPORT_SECURITY must be mesh or app_mtls}
      GRPC_TLS_ENABLED: ${GRPC_TLS_ENABLED:-false}
      GRPC_TLS_CA_FILE: ${GRPC_TLS_CA_FILE:-}
      GRPC_TLS_CERT_FILE: ${GRPC_TLS_CERT_FILE:-}
      GRPC_TLS_KEY_FILE: ${GRPC_TLS_KEY_FILE:-}
      GRPC_TLS_REQUIRE_CLIENT_CERT: ${GRPC_TLS_REQUIRE_CLIENT_CERT:-false}
      SERVER_READ_TIMEOUT: ${SERVER_READ_TIMEOUT:-30}
      SERVER_WRITE_TIMEOUT: ${SERVER_WRITE_TIMEOUT:-30}
      SERVER_IDLE_TIMEOUT: ${SERVER_IDLE_TIMEOUT:-60}
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      AUTH_SERVICE_URL: http://auth-service:${AUTH_SERVICE_PORT:-8081}
      AUTH_SERVICE_GRPC_ADDR: auth-service:50051
      USER_SERVICE_URL: http://user-service:${USER_SERVICE_PORT:-8082}
      USER_SERVICE_GRPC_ADDR: user-service:50052
      POST_SERVICE_URL: http://post-service:${POST_SERVICE_PORT:-8083}
      POST_SERVICE_GRPC_ADDR: post-service:50053
      SEARCH_SERVICE_GRPC_ADDR: search-service:50054
      NOTIFICATION_SERVICE_URL: http://notification-service:${NOTIFICATION_SERVICE_PORT:-8084}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-100}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}
      CORS_EXPOSE_HEADERS: ${CORS_EXPOSE_HEADERS:-Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      AUTH_REFRESH_TOKEN_COOKIE: ${AUTH_REFRESH_TOKEN_COOKIE:-true}
      AUTH_REFRESH_TOKEN_COOKIE_SAMESITE: ${AUTH_REFRESH_TOKEN_COOKIE_SAMESITE:-Lax}
      REQUEST_MAX_BODY_BYTES: ${REQUEST_MAX_BODY_BYTES:-1048576}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      search-service:
        condition: service_started
      notification-service:
        condition: service_healthy
    networks:
      - edge_net
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--output-document=/dev/null", "http://localhost:${API_GATEWAY_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: microservices_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Server-side BFF target: the gateway over the Docker network (browser
      # never calls it directly — all client traffic goes through /api/bff/*).
      BACKEND_API_URL: http://api-gateway:${API_GATEWAY_PORT:-8080}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-refresh_token}
      BFF_TRUSTED_PROXY_HOPS: ${BFF_TRUSTED_PROXY_HOPS:-0}
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - edge_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: microservices_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - internal_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.2
    container_name: microservices_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - internal_net
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  redis_data:
    driver: local
  postgres_user_data:
    driver: local
  postgres_post_data:
    driver: local
  postgres_notification_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  edge_net:
    driver: bridge
  internal_net:
    driver: bridge
