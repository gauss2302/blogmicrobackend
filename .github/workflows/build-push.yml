name: build-push

# Build and push all service images to GitHub Container Registry (ghcr.io) on a
# version tag. Deploy then bumps the image tags in k8s/overlays/production.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # Gate the release on the same checks that run for ordinary commits, so a
  # tag can never publish an image that fails lint, typecheck or tests.
  verify:
    uses: ./.github/workflows/verify.yml

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - post-service
          - search-service
          - notification-service
          - frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag + build context
        id: meta
        # The tag comes from a git ref or a dispatch input, both of which accept
        # shell metacharacters (a tag may legally be named `v1$(...)`). Passing
        # values through env instead of interpolating `${{ }}` into the script
        # keeps them data, and the pattern check rejects anything that is not a
        # plain version so it cannot reach the registry either.
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          # Bash's =~ anchors against the whole string. grep would not: it is
          # line-oriented, so a tag containing a newline could satisfy ^...$ on
          # its first line and smuggle the rest into GITHUB_OUTPUT below.
          if [[ ! $RAW_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::refusing to build from malformed tag"
            exit 1
          fi
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          if [ "$SERVICE" = "frontend" ]; then
            echo "context=./frontend" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./frontend/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            # Go services build from the repo root so the Dockerfile can COPY proto.
            echo "context=." >> "$GITHUB_OUTPUT"
            echo "dockerfile=./services/${SERVICE}/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          platforms: linux/amd64
          # Only the version tag. A moving `latest` was overwritten by every
          # tag push and manual run, older versions included; production pins
          # exact versions and nothing reads `latest`.
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
