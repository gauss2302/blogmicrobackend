name: verify

# Runs on every push and PR. build-push.yml only fires on a version tag, so
# without this nothing was checked on ordinary commits — a broken typecheck or
# a failing test reached a release tag unnoticed and got pushed to ghcr.io.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: # so build-push can gate on this

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Same version as the deps stage of frontend/Dockerfile.
          bun-version: "1.2.23"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - post-service
          - search-service
          - notification-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    # Tests that need a real Postgres, Redis or RabbitMQ read these variables and
    # skip without them. Without the services below they never ran in CI, which
    # is how a migration that Postgres rejects reached main with a green build.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:3-alpine
        ports: ["5672:5672"]
        # A plain TCP check, not the RabbitMQ CLI: run as root before the server
        # has written its Erlang cookie, the CLI creates a root-owned cookie and
        # the server then dies with "eacces". Seen while testing this job locally.
        options: >-
          --health-cmd "nc -z localhost 5672"
          --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
      TEST_REDIS_ADDR: 127.0.0.1:6379
      TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  proto:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: proto/go.mod
          cache-dependency-path: proto/go.sum

      - name: Test
        run: go test ./...
