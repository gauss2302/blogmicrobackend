# Production environment overrides. Strategic-merge: env entries merge by name,
# so these replace the localhost values from base while leaving the rest intact.
# Replace blog.example.com with your real domain everywhere below.
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: blogmesh }
spec:
  template:
    spec:
      containers:
        - name: api-gateway
          env:
            - { name: CORS_ALLOWED_ORIGINS, value: "https://blog.example.com" }
            # Behind TLS the refresh cookie can be SameSite=Strict end-to-end.
            - { name: AUTH_REFRESH_TOKEN_COOKIE_SAMESITE, value: "Strict" }
            # Per-client rate limiting. Inbound traffic reaches the app through
            # the Linkerd proxy in this pod, so the peer is always the pod's own
            # IP; without this every client shares one rate-limit bucket. Trusting
            # that one address lets the gateway read the client from
            # X-Forwarded-For, which Traefik and the frontend BFF set.
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - { name: TRUSTED_PROXIES, value: "$(POD_IP)" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: blogmesh }
spec:
  template:
    spec:
      containers:
        - name: frontend
          env:
            # One trusted proxy (Traefik) sits in front of the frontend, so the
            # BFF may forward the client address it reports to the gateway.
            - { name: BFF_TRUSTED_PROXY_HOPS, value: "1" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: blogmesh }
spec:
  template:
    spec:
      containers:
        - name: auth-service
          env:
            - { name: GOOGLE_REDIRECT_URL, value: "https://blog.example.com/api/v1/auth/google/callback" }
            - { name: GOOGLE_DEFAULT_WEB_REDIRECT_URI, value: "https://blog.example.com/auth/callback" }
            - { name: GOOGLE_ALLOWED_WEB_REDIRECT_URIS, value: "https://blog.example.com/auth/callback" }
            - { name: FRONTEND_URL, value: "https://blog.example.com" }
---
# Production declares itself, so the services engage every production-only
# guard: rejection of template placeholder secrets, mandatory transport and
# internal-HTTP trust modes, no gRPC reflection, Secure cookies.
apiVersion: v1
kind: ConfigMap
metadata: { name: blogmesh-common, namespace: blogmesh }
data:
  ENVIRONMENT: production
