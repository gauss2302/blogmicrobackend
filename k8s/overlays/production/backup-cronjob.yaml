# Daily pg_dump of all three databases to the postgres-backups PVC (gzip, 14-day
# retention). This is node-local — for off-site durability, add an upload step to
# S3-compatible object storage (see docs/production.md) so a node loss can't take
# both the data and its backups.
apiVersion: batch/v1
kind: CronJob
metadata: { name: postgres-backup, namespace: blogmesh }
spec:
  schedule: "0 3 * * *" # daily at 03:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        # The label is load-bearing: the postgres NetworkPolicies admit this job
        # by it, so a backup pod without it cannot reach the databases.
        metadata: { labels: { app: postgres-backup } }
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70 # 'postgres' uid in the alpine image
            fsGroup: 70
          containers:
            - name: backup
              image: postgres:15-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # pipefail: without it a failed pg_dump still exits 0 through gzip,
                  # leaves an empty archive and lets the retention below delete the
                  # last good backups. A failed database does not stop the others:
                  # all three are attempted, then the job fails and skips retention.
                  set -eu
                  set -o pipefail
                  ts="$(date +%Y%m%d-%H%M%S)"
                  rm -f /backups/*.tmp
                  failed=""
                  dump() {
                    if PGPASSWORD="$2" pg_dump -h "postgres-$1" -U postgres -d "${1}db" \
                        | gzip > "/backups/$1-${ts}.sql.gz.tmp"; then
                      mv "/backups/$1-${ts}.sql.gz.tmp" "/backups/$1-${ts}.sql.gz"
                      echo "  dumped ${1}db"
                    else
                      rm -f "/backups/$1-${ts}.sql.gz.tmp"
                      failed="$failed ${1}db"
                    fi
                  }
                  dump user "$PG_USER_PW"
                  dump post "$PG_POST_PW"
                  dump notification "$PG_NOTIFICATION_PW"
                  if [ -n "$failed" ]; then echo "backup FAILED:$failed" >&2; exit 1; fi
                  find /backups -name '*.sql.gz' -mtime +14 -delete
                  echo "backup complete: $ts"
              env:
                - { name: PG_USER_PW, valueFrom: { secretKeyRef: { name: blogmesh-secrets, key: POSTGRES_USER_PASSWORD } } }
                - { name: PG_POST_PW, valueFrom: { secretKeyRef: { name: blogmesh-secrets, key: POSTGRES_POST_PASSWORD } } }
                - { name: PG_NOTIFICATION_PW, valueFrom: { secretKeyRef: { name: blogmesh-secrets, key: POSTGRES_NOTIFICATION_PASSWORD } } }
              volumeMounts: [{ name: backups, mountPath: /backups }]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
          volumes:
            - { name: backups, persistentVolumeClaim: { claimName: postgres-backups } }
