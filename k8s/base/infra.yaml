# ---------------- RabbitMQ ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: blogmesh }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: blogmesh-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: blogmesh-secrets, key: RABBITMQ_PASSWORD } }
            - name: RABBITMQ_DEFAULT_VHOST
              valueFrom: { secretKeyRef: { name: blogmesh-secrets, key: RABBITMQ_VHOST } }
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          # A TCP probe of the AMQP port, not the RabbitMQ CLI: `ping` answered
          # before the port was open, and a CLI probe that runs before the server
          # has written its Erlang cookie creates a root-owned one and crashes it.
          readinessProbe:
            tcpSocket: { port: 5672 }
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: blogmesh }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: mgmt, port: 15672, targetPort: 15672 }
---
# ---------------- Kafka (KRaft, single node) ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka, namespace: blogmesh }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          command:
            - /bin/bash
            - -c
            - |
              umask 077
              cat > /tmp/kafka_server_jaas.conf <<EOF
              KafkaServer {
                org.apache.kafka.common.security.plain.PlainLoginModule required
                username="admin"
                password="${KAFKA_ADMIN_PASSWORD}"
                user_admin="${KAFKA_ADMIN_PASSWORD}"
                user_app="${KAFKA_SASL_PASSWORD}";
              };
              EOF
              export KAFKA_OPTS="-Djava.security.auth.login.config=/tmp/kafka_server_jaas.conf"
              # ACLs live in the cluster metadata, not in a file, so they are
              # written once the broker answers. Adding an ACL that exists changes
              # nothing, so this runs on every start. Until it is done the
              # services are refused; they retry. The CLI heap is capped so it
              # fits next to the broker inside the memory limit.
              (
                printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="%s";\n' "${KAFKA_ADMIN_PASSWORD}" > /tmp/admin.properties
                acl() { KAFKA_OPTS= KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-acls.sh --bootstrap-server localhost:9092 --command-config /tmp/admin.properties "$@" >/dev/null 2>&1; }
                until acl --list; do sleep 3; done
                until acl --add --allow-principal User:app --operation Read --operation Write --operation Describe --operation Create --topic search. --resource-pattern-type prefixed \
                  && acl --add --allow-principal User:app --operation Read --operation Describe --group search- --resource-pattern-type prefixed; do sleep 3; done
                echo "kafka acls ready: User:app may use topics search.* and consumer groups search-*"
              ) &
              exec /etc/kafka/docker/run
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          env:
            - { name: KAFKA_NODE_ID, value: "0" }
            - { name: KAFKA_PROCESS_ROLES, value: "controller,broker" }
            # The controller listener is plaintext, so it is bound to loopback:
            # this node is the only one that talks to it.
            - { name: KAFKA_LISTENERS, value: "SASL_PLAINTEXT://:9092,CONTROLLER://localhost:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "SASL_PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "SASL_PLAINTEXT" }
            - { name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL, value: "PLAIN" }
            - { name: KAFKA_SASL_ENABLED_MECHANISMS, value: "PLAIN" }
            - { name: KAFKA_LISTENER_NAME_SASL_PLAINTEXT_SASL_ENABLED_MECHANISMS, value: "PLAIN" }
            - name: KAFKA_SASL_PASSWORD
              valueFrom: { secretKeyRef: { name: blogmesh-secrets, key: KAFKA_SASL_PASSWORD } }
            - name: KAFKA_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: blogmesh-secrets, key: KAFKA_ADMIN_PASSWORD } }
            # The services share the "app" user, which may only use search.*
            # topics and search-* consumer groups (ACLs above). "admin" is the
            # broker's own identity. ANONYMOUS is what this node is on its
            # loopback controller listener; nothing can be ANONYMOUS on the SASL
            # listener.
            - { name: KAFKA_AUTHORIZER_CLASS_NAME, value: "org.apache.kafka.metadata.authorizer.StandardAuthorizer" }
            - { name: KAFKA_SUPER_USERS, value: "User:admin;User:ANONYMOUS" }
            # Single-node KRaft: reach our own controller via localhost. Using the
            # Service name deadlocks (it only routes to a Ready pod, which needs the
            # quorum, which needs this connection).
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "0@localhost:9093" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms256m" }
          ports: [{ containerPort: 9092 }]
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: blogmesh }
spec:
  selector: { app: kafka }
  ports:
    - { name: plaintext, port: 9092, targetPort: 9092 }
---
# ---------------- OpenSearch (single node, basic auth, HTTP inside the cluster) ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: opensearch, namespace: blogmesh }
spec:
  replicas: 1
  selector: { matchLabels: { app: opensearch } }
  template:
    metadata: { labels: { app: opensearch } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.1
          # search-service does not log in as admin. Once the node answers, this
          # creates (or updates) its user and a role limited to the two indices
          # it owns. PUT is idempotent, so it runs on every start. "users" and
          # "posts" are OPENSEARCH_USERS_INDEX and OPENSEARCH_POSTS_INDEX of
          # search-service. A refusal is printed with OpenSearch's reason (a weak
          # password, for one): until this succeeds search-service cannot log in.
          command:
            - /bin/bash
            - -c
            - |
              (
                auth="admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
                until curl -sf -o /dev/null -u "$auth" http://localhost:9200/_cluster/health; do sleep 3; done
                admin() {
                  out=$(curl -s -w ' HTTP %{http_code}' -u "$auth" -H 'Content-Type: application/json' -X PUT "http://localhost:9200/_plugins/_security/api/$1" -d "$2")
                  case "$out" in *' HTTP 200' | *' HTTP 201') return 0 ;; esac
                  echo "opensearch security bootstrap: $1 refused: $out"
                  return 1
                }
                until admin roles/blog_search '{"index_permissions":[{"index_patterns":["users","posts"],"allowed_actions":["crud","create_index","indices:admin/get"]}]}' \
                  && admin "internalusers/${SEARCH_USERNAME}" '{"password":"'"${SEARCH_PASSWORD}"'"}' \
                  && admin rolesmapping/blog_search '{"users":["'"${SEARCH_USERNAME}"'"]}'; do sleep 15; done
                echo "opensearch security ready: user ${SEARCH_USERNAME} is limited to the indices users and posts"
              ) &
              exec ./opensearch-docker-entrypoint.sh opensearch
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1536Mi" }
          env:
            - { name: discovery.type, value: single-node }
            - { name: bootstrap.memory_lock, value: "false" }
            - { name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
            - { name: plugins.security.ssl.http.enabled, value: "false" }
            - { name: OPENSEARCH_INITIAL_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: blogmesh-secrets, key: OPENSEARCH_PASSWORD } } }
            - { name: SEARCH_USERNAME, valueFrom: { secretKeyRef: { name: blogmesh-secrets, key: OPENSEARCH_SEARCH_USERNAME } } }
            - { name: SEARCH_PASSWORD, valueFrom: { secretKeyRef: { name: blogmesh-secrets, key: OPENSEARCH_SEARCH_PASSWORD } } }
          ports: [{ containerPort: 9200 }, { containerPort: 9600 }]
          volumeMounts: [{ name: data, mountPath: /usr/share/opensearch/data }]
          # Basic auth is required, so an unauthenticated httpGet would get 401
          # and the pod would never become Ready. Same check as the Compose healthcheck.
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -sf -u \"admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" http://localhost:9200/_cluster/health"]
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: opensearch, namespace: blogmesh }
spec:
  selector: { app: opensearch }
  ports:
    - { name: http, port: 9200, targetPort: 9200 }
    - { name: perf, port: 9600, targetPort: 9600 }
