# Network isolation for the datastores and brokers.
#
# WHY: the infra pods are the one tier the mesh cannot protect. They are not
# Linkerd-injected, and every app pod carries
# `config.linkerd.io/skip-outbound-ports: 5432,5672,6379,9092,9200` (apps.yaml),
# so that traffic bypasses the proxy entirely — Linkerd Servers and
# AuthorizationPolicies (policy.yaml) cannot see it. Without the policies below,
# any pod in the cluster could reach OpenSearch, Kafka, Redis, RabbitMQ and all
# three Postgres instances directly. Each of them asks for a password, but the
# app tier shares those passwords, so reachability is what keeps a compromised
# pod from reading or wiping the search index, publishing forged search.* events
# that search-service indexes as authentic, or opening a database session.
#
# HOW: selecting a pod in any NetworkPolicy makes its ingress deny-by-default, so
# each policy below is both the deny and the sole allow-list for one component.
# These are Ingress-only: egress and DNS are deliberately untouched, since
# restricting them buys little here and breaks easily.
#
# Verified on k3s/k3d (the runtime k8s/up.sh creates, NetworkPolicy enforced by
# kube-router): with a pod-selector-only ingress policy in place, kubelet
# readiness probes still reach the pod (so kafka's tcpSocket:9092 probe keeps
# passing; opensearch's probe is exec and runs inside the pod), an allowed pod
# connects, and a non-allowed pod is refused.
#
# Adding a component or a caller means adding it here, or it will be denied.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: redis-ingress, namespace: blogmesh }
spec:
  podSelector: { matchLabels: { app: redis } }
  policyTypes: [Ingress]
  ingress:
    # api-gateway: rate-limit counters. auth-service: tokens, blacklist, OAuth state.
    - from:
        - podSelector: { matchLabels: { app: api-gateway } }
        - podSelector: { matchLabels: { app: auth-service } }
        - podSelector: { matchLabels: { app: user-service } }
        - podSelector: { matchLabels: { app: post-service } }
        - podSelector: { matchLabels: { app: notification-service } }
      ports:
        - { protocol: TCP, port: 6379 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-user-ingress, namespace: blogmesh }
spec:
  podSelector: { matchLabels: { app: postgres-user } }
  policyTypes: [Ingress]
  ingress:
    # Owning service only, plus the production backup CronJob.
    - from:
        - podSelector: { matchLabels: { app: user-service } }
        - podSelector: { matchLabels: { app: postgres-backup } }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-post-ingress, namespace: blogmesh }
spec:
  podSelector: { matchLabels: { app: postgres-post } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: post-service } }
        - podSelector: { matchLabels: { app: postgres-backup } }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: postgres-notification-ingress, namespace: blogmesh }
spec:
  podSelector: { matchLabels: { app: postgres-notification } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: notification-service } }
        - podSelector: { matchLabels: { app: postgres-backup } }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: rabbitmq-ingress, namespace: blogmesh }
spec:
  podSelector: { matchLabels: { app: rabbitmq } }
  policyTypes: [Ingress]
  ingress:
    # post-service publishes post.* events; notification-service consumes them.
    # The management UI (15672) has no in-cluster client and stays unreachable;
    # reach it with `kubectl port-forward` when an operator needs it.
    - from:
        - podSelector: { matchLabels: { app: post-service } }
        - podSelector: { matchLabels: { app: notification-service } }
      ports:
        - { protocol: TCP, port: 5672 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: kafka-ingress, namespace: blogmesh }
spec:
  podSelector: { matchLabels: { app: kafka } }
  policyTypes: [Ingress]
  ingress:
    # post-service produces search.posts, user-service produces search.users,
    # and search-service consumes both and writes the DLQ.
    - from:
        - podSelector: { matchLabels: { app: post-service } }
        - podSelector: { matchLabels: { app: user-service } }
        - podSelector: { matchLabels: { app: search-service } }
      ports:
        - { protocol: TCP, port: 9092 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: opensearch-ingress, namespace: blogmesh }
spec:
  podSelector: { matchLabels: { app: opensearch } }
  policyTypes: [Ingress]
  ingress:
    # search-service is the only client: it owns both indexing and querying.
    # OpenSearch requires basic auth, but search-service uses the admin account,
    # so whatever reaches :9200 with that password has unrestricted access. This
    # policy keeps the reachable set to one workload — see
    # docs/production-security.md.
    - from:
        - podSelector: { matchLabels: { app: search-service } }
      ports:
        - { protocol: TCP, port: 9200 }
